<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebLingo · Allow access</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #ffffff;
        --text: #1f2328;
        --muted: #646b75;
        --border: #dde1e6;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        --bad: #cf222e;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16181c;
          --card: #1f2227;
          --text: #e6e8eb;
          --muted: #9aa1ab;
          --border: #343941;
          --accent: #4f8cff;
          --accent-hover: #6b9fff;
          --bad: #ff7b72;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        max-width: 420px;
        margin: 16px;
        padding: 24px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
      }
      button {
        padding: 10px 20px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: var(--accent-hover);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #status {
        margin: 16px 0 0;
      }
      #status.error {
        color: var(--bad);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Allow WebLingo on <span id="host"></span></h1>
      <p>WebLingo needs access to this website to translate it. Translation happens on your device.</p>
      <button id="allow" type="button">Allow access</button>
      <p id="status" role="status"></p>
    </main>
    <script src="grant.js"></script>
  </body>
</html>
